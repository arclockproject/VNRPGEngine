apply plugin: 'com.android.application'

// Release signing (Play Store): android/keystore.properties, never committed. See dev-notes/android.md.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }
// Asset packs written by scripts/build.ts android-bundle (see settings.gradle).
def assetPackFile = rootProject.file('asset-packs.txt')
def assetPackNames = assetPackFile.exists() ? assetPackFile.readLines().findAll { it.trim() }.collect { ":" + it.trim() } : []
// The game's store id, name and version: src/content/config/app.ts, written to android/app.properties
// by scripts/build.ts before every Android build. The defaults only show in an Android Studio build
// made before any scripts/build.ts run.
def appInfoFile = rootProject.file('app.properties')
def appInfo = new Properties()
if (appInfoFile.exists()) appInfoFile.withReader('UTF-8') { appInfo.load(it) }
def gameAppId = appInfo.getProperty('appId', 'org.INSERTORGANISATIONHERE.INSERTGAMENAMEHERE')
// resValue text goes into an XML resource as it is: escape what Android resources treat specially.
def resText = { String text -> text.replace('\\', '\\\\').replace('&', '&amp;').replace('<', '&lt;').replace("'", "\\'").replace('"', '\\"') }
def gameName = resText(appInfo.getProperty('name', 'INSERTGAMENAMEHERE'))

android {
    namespace = "org.INSERTORGANISATIONHERE.INSERTGAMENAMEHERE"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId gameAppId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(appInfo.getProperty('build', '1'))
        versionName appInfo.getProperty('version', '1.0')
        // The shown name and the ids Capacitor reads (were in res/values/strings.xml).
        resValue "string", "app_name", gameName
        resValue "string", "title_activity_main", gameName
        resValue "string", "package_name", gameAppId
        resValue "string", "custom_url_scheme", gameAppId
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    assetPacks = assetPackNames
    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
